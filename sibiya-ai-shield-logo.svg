<svg width="720" height="230" viewBox="0 0 720 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C97A"/>
      <stop offset="55%" stop-color="#C9A44C"/>
      <stop offset="100%" stop-color="#9C7C33"/>
    </linearGradient>
    <pattern id="diamondBorder" width="26" height="14" patternUnits="userSpaceOnUse">
      <path d="M13 2 L22 7 L13 12 L4 7 Z" fill="none" stroke="#C9A44C" stroke-width="1" opacity="0.75"/>
      <circle cx="13" cy="7" r="1.1" fill="#C9A44C" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect x="2" y="2" width="716" height="226" rx="26" fill="#0B0B0C" stroke="#C9A44C" stroke-width="1" opacity="0.9"/>

  <!-- top / bottom amasumpa borders -->
  <rect x="12" y="10" width="696" height="14" fill="url(#diamondBorder)"/>
  <rect x="12" y="206" width="696" height="14" fill="url(#diamondBorder)"/>

  <!-- icon frame -->
  <rect x="42" y="46" width="140" height="140" rx="32" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <rect x="42" y="46" width="140" height="140" rx="32" fill="#0B0B0C"/>

  <!-- crossed spears, behind the shield -->
  <g stroke="#8A8580" stroke-width="3" opacity="0.9">
    <line x1="62" y1="170" x2="150" y2="66" />
    <line x1="160" y1="170" x2="88" y2="60" />
  </g>
  <!-- spear tips -->
  <path d="M150 66 L157 58 L163 66 Z" fill="#D8D2C4"/>
  <path d="M88 60 L82 52 L94 52 Z" fill="#D8D2C4"/>
  <!-- pennant flag on right spear -->
  <path d="M150 66 L172 74 L150 80 Z" fill="#A13D2D"/>

  <!-- shield (ihawu) -->
  <path
    d="M112 68
       C 138 68 150 96 150 116
       C 150 148 132 172 112 180
       C 92 172 74 148 74 116
       C 74 96 86 68 112 68 Z"
    fill="#EDE6D6"
    stroke="#0B0B0C"
    stroke-width="1.5"
  />
  <!-- shield spine / beadwork lacing -->
  <line x1="112" y1="72" x2="112" y2="176" stroke="#0B0B0C" stroke-width="1.5"/>
  <g fill="#0B0B0C">
    <rect x="103" y="82" width="18" height="6"/>
    <rect x="103" y="94" width="18" height="6"/>
    <rect x="103" y="106" width="18" height="6"/>
    <rect x="103" y="118" width="18" height="6"/>
    <rect x="103" y="130" width="18" height="6"/>
    <rect x="103" y="142" width="18" height="6"/>
    <rect x="103" y="154" width="18" height="6"/>
  </g>

  <!-- gold S monogram overlapping bottom-right of icon frame -->
  <g transform="translate(146, 128)">
    <path
      transform="scale(0.16)"
      d="M 176 152 L 304 152 L 304 196 L 208 196 L 208 220 L 304 220 L 304 328 L 176 328 L 176 284 L 272 284 L 272 260 L 176 260 Z"
      fill="url(#gold)"
    />
  </g>

  <!-- wordmark -->
  <g transform="translate(206, 92)">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#F5F1E8" letter-spacing="2">SIBIYA</text>
    <text x="196" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#C9A44C" letter-spacing="2">AI</text>
    <rect x="0" y="14" width="470" height="1.5" fill="#C9A44C" opacity="0.6"/>
    <rect x="0" y="18" width="120" height="2" fill="#A13D2D" opacity="0.85"/>
    <text x="0" y="38" font-family="Georgia, serif" font-size="14" fill="#8A8580" letter-spacing="3">UMOYA WESIZWE SAKWAZULU</text>
  </g>
</svg>
